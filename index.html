<html lang="en" class="light">

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>EduPulse AI | Local-First Teacher Exam Paper Generator</title>
    <meta name="title" content="EduPulse AI | Local-First Teacher Exam Paper Generator" />
    <meta name="description" content="Turn your textbooks and question banks into customized, board-standard exam papers in minutes. 100% local-first on your device. CBSE, ICSE, and State Board templates with print-ready Word and PDF export." />
    <link rel="canonical" href="https://edupulse.ai/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://edupulse.ai/" />
    <meta property="og:title" content="EduPulse AI | Local-First Teacher Exam Paper Generator" />
    <meta property="og:description" content="Turn textbooks into board-ready examination papers in minutes. Stored 100% locally on your computer with Word & PDF export." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://edupulse.ai/" />
    <meta property="twitter:title" content="EduPulse AI | Local-First Teacher Exam Paper Generator" />
    <meta property="twitter:description" content="Turn textbooks into board-ready examination papers in minutes. Stored 100% locally on your computer with Word & PDF export." />
    <meta property="twitter:image" content="/og-image.svg" />

    <!-- JSON-LD Structured Data for SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EduPulse AI",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web, Chrome, Edge, Firefox, Safari",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "description": "Local-first teacher examination paper creation and blueprint studio for CBSE, ICSE, and Indian State Boards with client-side OCR and Word/PDF export."
    }
    </script>

    <!-- Google Fonts Preconnect and Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body class="bg-surface-canvas text-neutral-900 dark:text-neutral-50 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
