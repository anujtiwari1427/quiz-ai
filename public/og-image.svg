<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Warm stone background -->
  <rect width="1200" height="630" fill="#fafaf9" />
  
  <!-- Subtle Hero Radial Wash -->
  <circle cx="600" cy="80" r="450" fill="#4338ca" fill-opacity="0.08" />
  <circle cx="750" cy="180" r="300" fill="#f59e0b" fill-opacity="0.04" />

  <!-- Outer frame border -->
  <rect x="32" y="32" width="1136" height="566" rx="24" stroke="#e7e5e4" stroke-width="2" />

  <!-- Logo Icon: Deep Indigo with Saffron accent -->
  <rect x="80" y="80" width="72" height="72" rx="20" fill="#4338ca" />
  <path d="M104 100H128M104 114H128M104 128H120" stroke="white" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="146" cy="86" r="8" fill="#f59e0b" stroke="#fafaf9" stroke-width="3" />

  <!-- Brand Title & Tagline -->
  <text x="172" y="116" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#1c1917" letter-spacing="-0.5">EduPulse <tspan fill="#4338ca">AI</tspan></text>
  <text x="174" y="142" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#78716c">Local-First Exam Paper Suite</text>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#1c1917" letter-spacing="-1.5">
    Turn your textbooks into
  </text>
  <text x="80" y="340" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#4338ca" letter-spacing="-1.5">
    exam-ready papers in minutes.
  </text>

  <!-- Subheadline -->
  <text x="80" y="410" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#57534e">
    Upload textbooks &amp; question banks. Set CBSE, ICSE, or State Board blueprints.
  </text>
  <text x="80" y="445" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#57534e">
    Export print-ready PDF and editable Word documents with aligned answer keys.
  </text>

  <!-- Badges / Pillars -->
  <g transform="translate(80, 500)">
    <rect width="250" height="42" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
    <text x="24" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3730a3">✓ 100% On-Device Privacy</text>
  </g>

  <g transform="translate(350, 500)">
    <rect width="250" height="42" rx="10" fill="#f0fdf4" stroke="#bbf7d0" />
    <text x="24" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#166534">✓ CBSE, ICSE &amp; State Boards</text>
  </g>

  <g transform="translate(620, 500)">
    <rect width="270" height="42" rx="10" fill="#fef3c7" stroke="#fde68a" />
    <text x="24" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#92400e">✓ English, Hindi &amp; Marathi</text>
  </g>
</svg>
